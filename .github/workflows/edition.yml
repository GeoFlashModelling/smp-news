name: Edition

# Builds the headline edition from live feeds and publishes it to GitHub Pages (thesmpnews.com).
# A failed build (e.g. too few multi-source stories) deploys nothing, so the previous edition stays up.

on:
  # Hourly runs come from the Cloudflare Worker in scheduler/ (GitHub's own timer skips runs at busy times).
  workflow_dispatch:
  schedule:
    - cron: "17 2,5,8,11,22 * * *" # backup, in case the Worker stops; Australian daytime only (UTC hours)
  push:
    branches: [main]
    paths: ["src/**", "assets/**", "config/**", "package-lock.json", ".github/workflows/edition.yml"]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Photo lookups and searches from earlier editions (a week's answers), so each run only searches for new stories.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/images.json
          key: images-${{ github.run_id }}
          restore-keys: images-
      # Summaries already written, today's paid spend and which free models are used up for the day.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/summaries.json
          key: summaries-${{ github.run_id }}
          restore-keys: summaries-
      - run: npm run edition
        env:
          # Free key: photo search words, and summaries when SUMMARIES is "on".
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Paid key: last resort for front-page summaries, capped at about A$3.20 a day in src/ai/summarise.ts.
          GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}
          SUMMARIES: ${{ vars.SUMMARIES }}
          SUMMARY_PAID_MODEL: ${{ vars.SUMMARY_PAID_MODEL }}
          PHOTO_AI: ${{ vars.PHOTO_AI }}
          PHOTO_AI_MODEL: ${{ vars.PHOTO_AI_MODEL }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
