name: Edition

# Builds the headline edition from live feeds and publishes it to GitHub Pages (thesmpnews.com).
# A failed build (e.g. too few multi-source stories) deploys nothing, so the previous edition stays up.

on:
  # Hourly runs come from the Cloudflare Worker in scheduler/ (GitHub's own timer skips runs at busy times).
  workflow_dispatch:
  schedule:
    - cron: "17 2,5,8,11,22 * * *" # backup, in case the Worker stops; Australian daytime only (UTC hours)
  push:
    branches: [main]
    paths: ["src/**", "assets/**", "config/**", "package-lock.json", ".github/workflows/edition.yml"]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # Summaries stop at 8 minutes and photo searches at 6; this is the backstop.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Restored here and saved at the end even when the edition fails or is stopped, so paid work is never lost:
      # photo lookups, searches and each story's photo (images.json); summaries written, today's paid spend, free models
      # used up and stories waiting to be written (summaries.json); story IDs and the reports in each (stories.json).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/images.json
          key: images-${{ github.run_id }}
          restore-keys: images-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/summaries.json
          key: summaries-${{ github.run_id }}
          restore-keys: summaries-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/stories.json
          key: stories-${{ github.run_id }}
          restore-keys: stories-
      # Today's quiz and the questions used before, so the quiz stays the same all day and doesn't repeat.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/quiz.json
          key: quiz-${{ github.run_id }}
          restore-keys: quiz-
      # Today's fun facts, chosen once a day.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/facts.json
          key: facts-${{ github.run_id }}
          restore-keys: facts-
      # Each edition's numbers for the last few days, read by the nightly report (report.yml).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/history.json
          key: history-${{ github.run_id }}
          restore-keys: history-
      - id: edition
        run: npm run edition
        # Inside the job's 30 minutes, so the steps that save the state files still get to run.
        timeout-minutes: 24
        env:
          # Free key: photo search words, and summaries when SUMMARIES is "on".
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Paid key: last resort for front-page stories with no summary, capped at about A$3.20 a day in src/ai/summarise.ts.
          GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}
          SUMMARIES: ${{ vars.SUMMARIES }}
          SUMMARY_PAID_MODEL: ${{ vars.SUMMARY_PAID_MODEL }}
          PHOTO_AI: ${{ vars.PHOTO_AI }}
          PHOTO_AI_MODEL: ${{ vars.PHOTO_AI_MODEL }}
      - name: Save photos state
        if: always() && hashFiles('.cache/images.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/images.json
          key: images-${{ github.run_id }}
      - name: Save summaries state
        if: always() && hashFiles('.cache/summaries.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/summaries.json
          key: summaries-${{ github.run_id }}
      - name: Save story IDs
        if: always() && hashFiles('.cache/stories.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/stories.json
          key: stories-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      # The owner's email after each update (scripts/report.ts): how it went and today's AI costs. Code pushes are
      # left out, and a failed email never stops the edition being published.
      - name: Email this update
        if: always() && github.event_name != 'push'
        continue-on-error: true
        run: npx tsx scripts/report.ts
        env:
          REPORT_KIND: edition
          EDITION_OUTCOME: ${{ steps.edition.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_URL: ${{ vars.REPORT_URL }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
